[project]
name = "driven"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# providers
openai = [ "openai>=2.41.0" ]
anthropic = [ "anthropic>=0.105.2" ]
llms = [
    "openai>=2.41.0",
    "anthropic>=0.105.2",
]

# apps
gui = [ "raylib>=5.5.0" ]

# batteries included
all = [
    "openai>=2.41.0",
    "anthropic>=0.105.2",
    "python-dotenv>=1.2.2",
    "raylib>=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]


[tool.uv]
package = true
